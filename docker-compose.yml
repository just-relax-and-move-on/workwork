version: '3.8'

services:
  # 前端服务 (生产环境)
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - API_HOST=backend  # 后端服务名称
      - API_PORT=8080
    depends_on:
      - backend
    networks:
      - app-network

  # 前端服务 (开发环境)
  frontend-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - VITE_API_HOST=backend
      - VITE_API_PORT=8080
      - VITE_API_PROTOCOL=http
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - backend
    networks:
      - app-network
    profiles:
      - dev

  # 后端服务 (这里是占位符，需要根据实际后端服务配置)
  backend:
    # 示例：如果你的后端服务也有 Dockerfile
    # build: ./backend
    # 或者使用现有镜像
    image: your-backend-image:latest
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      # 添加你的后端环境变量
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 